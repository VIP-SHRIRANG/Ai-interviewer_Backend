<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AI Interviewer</title>

    <link
        rel="stylesheet"
        href="/css/style.css"
    >
</head>

<body>

    <main class="container">

        <h1>AI Interviewer</h1>

        <div class="controls">

            <button id="start-btn">
                🎤 Start Speaking
            </button>

            <button id="stop-btn">
                ⏹ Stop
            </button>

        </div>


        <section class="transcript-section">

            <h2>Your Question</h2>

            <div id="question-output">
                Waiting for your question...
            </div>

        </section>


        <section class="answer-section">

            <h2>AI Interviewer</h2>

            <div id="answer-output">
                Waiting for response...
            </div>

        </section>

    </main>


    <!-- Frontend modules -->

    <script
        type="module"
        src="/js/app.js"
    ></script>

</body>

</html>
